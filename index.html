<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mays 💖</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffafbd, #ffc3a0);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 22px;
    padding: 30px;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255, 105, 180, 0.45);
    animation: fadeIn 2s ease;
  }

  h1 {
    color: #e75480;
    margin-bottom: 5px;
  }

  h2 {
    color: #ff69b4;
    margin-top: 0;
  }

  .heart {
    font-size: 2.8em;
    animation: beat 1.2s infinite;
    margin: 15px 0;
  }

  #typing {
    color: #555;
    font-size: 1em;
    line-height: 1.7;
    min-height: 220px;
    white-space: pre-line;
  }

  button {
    background: #ff69b4;
    border: none;
    color: white;
    padding: 12px 24px;
    border-radius: 25px;
    font-size: 1em;
    cursor: pointer;
    margin-top: 15px;
  }

  button:hover {
    background: #e75480;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .floating-hearts span {
    position: absolute;
    bottom: -50px;
    font-size: 22px;
    animation: floatUp 7s linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="floating-hearts"></div>

<div class="card">
  <h1>Happy Birthday 🎂</h1>
  <h2>Mays 💕</h2>

  <div class="heart">❤️</div>

  <div id="typing"></div>

  <button onclick="startTyping()">Tap to read my heart 💖</button>
</div>

<!-- 🎵 BACKGROUND MUSIC -->
<audio autoplay loop>
  <source src="https://YOUR-ROMANTIC-MUSIC-LINK-HERE.mp3" type="audio/mpeg">
</audio>

<script>
  const text = `
Mays, you are truly the most beautiful person I know — inside and out.

You are the best thing that has happened to me at this moment in my life.
Every smile of yours makes my world brighter, and every second with you means everything to me.

I want you with me in every step I take in my life.
I don’t want to lose you under any circumstances.

I want to build my future with you, walk every path with you,
and I would sacrifice anything for your happiness.

May God keep you safe for me, protect you, and bless your life always.

Happy Birthday, my love 💖
Forever yours,
Amin
`;

  let index = 0;
  let started = false;

  function startTyping() {
    if (started) return;
    started = true;
    const typingDiv = document.getElementById("typing");
    const interval = setInterval(() => {
      typingDiv.innerHTML += text[index];
      index++;
      if (index >= text.length) clearInterval(interval);
    }, 40);
  }

  const heartContainer = document.querySelector(".floating-hearts");

  setInterval(() => {
    const heart = document.createElement("span");
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    heartContainer.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }, 500);
</script>

</body>
</html>
